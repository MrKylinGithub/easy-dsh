name: release

# Pushing a `v*` tag builds macOS (x64 + arm64) and Windows (x64) installers
# and publishes them as GitHub Release assets with SHA-256 checksums.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GitHub-hosted runners are faster against the official registries;
      # empty mirror vars keep build.mjs from overriding them with npmmirror.
      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: ''
          ELECTRON_BUILDER_BINARIES_MIRROR: ''

      - name: Build macOS (x64 + arm64)
        run: node scripts/build.mjs --mac --x64 --arm64
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: ''
          ELECTRON_BUILDER_BINARIES_MIRROR: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-assets
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: ''
          ELECTRON_BUILDER_BINARIES_MIRROR: ''

      - name: Build Windows (x64)
        run: node scripts/build.mjs --win
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          ELECTRON_MIRROR: ''
          ELECTRON_BUILDER_BINARIES_MIRROR: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: win-assets
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd assets
          find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
